[package]
name = "vogui-codegen"
version = "0.1.0"
edition = "2021"
description = "Governed Vogui typed App adapter generator"

[[bin]]
name = "vogui-generator-provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
vo-schema-compiler = { path = "../../../volang/lang/crates/vo-schema-compiler" }
